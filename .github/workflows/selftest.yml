name: selftest

# Checks every push to main: the browser engine on synthetic audio
# (tools/selftest.mjs), JS syntax, Python compiles, and the site build.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JavaScript parses
        run: |
          for f in web/js/*.js web/js/engine/*.js web/js/sections/*.js tools/*.mjs; do
            node --check "$f" 2>/dev/null || node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done

      - name: Python compiles
        run: python3 -m py_compile analyzer/*.py web/helper/set-replay-helper.py web/serve.py tools/*.py

      - name: Engine libraries (same pinned versions the site loads)
        run: |
          mkdir -p .engine-deps && cd .engine-deps
          npm pack --silent essentia.js@0.1.3 onnxruntime-web@1.30.0
          mkdir ess ort
          tar xzf essentia.js-0.1.3.tgz -C ess
          tar xzf onnxruntime-web-1.30.0.tgz -C ort

      - name: Engine self-test on synthetic audio
        run: node tools/selftest.mjs

      - name: Worker pool recovers from a crashed worker
        run: node tools/pool-test.mjs

      - name: Video soundtrack extractor on a real MOV
        run: node tools/demux-test.mjs

      - name: Page analyses (Spotify prompt, chapters, mixing, mood map, set card, compare) on the demo sets
        run: node tools/analysis-test.mjs

      - name: Site build
        run: bash tools/build-site.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python pipeline self-test on the same synthetic set
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q -r requirements.txt
          mkdir -p models && cp web/models/*.onnx web/models/*.json models/
          python tools/selftest_py.py


  # the whole site, in the three engines visitors actually use
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]   # webkit = Safari's engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Site build
        run: bash tools/build-site.sh
      - name: Browser end-to-end in ${{ matrix.browser }} (drop → analyze → result → naming)
        run: |
          npm i --no-save --silent playwright@1.55.0 axe-core@4.14.0 jsqr@1.4.0
          npx playwright install --with-deps ${{ matrix.browser }}
          # chromium runs in the runner's Google Chrome (what visitors use; it decodes AAC,
          # which Playwright's open-source Chromium can't), the others in Playwright's builds
          node tools/e2e.mjs --browser ${{ matrix.browser }} ${{ matrix.browser == 'chromium' && '--chrome' || '' }}
      - name: Accessibility (axe-core, WCAG 2.1 A/AA) on the landing and set pages
        if: matrix.browser == 'chromium'
        run: node tools/a11y.mjs --chrome
