<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Your playlist prompt · Set Replay</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#16151E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #16151E; --panel: #201E2B; --ink: #EFECF5; --ink-2: #C3BED3; --muted: #928DA6; --line: #3A3749; --green: #1ED760; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Archivo, system-ui, sans-serif; line-height: 1.5; }
    main { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
    .k { margin: 0; color: var(--muted); font-size: .8rem; letter-spacing: .14em; font-weight: 700; font-stretch: 112%; }
    h1 { margin: 6px 0 18px; font-size: 1.7rem; line-height: 1.15; font-stretch: 110%; }
    textarea { width: 100%; min-height: 220px; resize: vertical; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font: inherit; font-size: 1rem; }
    .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button, a.btn { flex: 1 1 auto; text-align: center; text-decoration: none; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 14px 18px; border-radius: 999px; cursor: pointer; }
    button { background: var(--green); color: #0B0B0B; border: 0; }
    a.btn { color: var(--ink); border: 1px solid var(--line); background: none; }
    ol { color: var(--ink-2); padding-left: 1.2em; margin: 22px 0 0; }
    li { margin: 6px 0; }
    .note { color: var(--muted); font-size: .85rem; margin-top: 22px; }
    .note a { color: var(--ink-2); }
    #status { min-height: 1.5em; color: var(--green); margin: 10px 0 0; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <p class="k">SET REPLAY</p>
  <h1 id="h">Your playlist prompt</h1>
  <label for="p" class="k" style="display:block;margin-bottom:6px">THE PROMPT</label>
  <textarea id="p" readonly></textarea>
  <div class="row">
    <button id="copy" type="button">Copy prompt</button>
    <a class="btn" id="open" href="https://open.spotify.com/">Open Spotify</a>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <ol id="how"></ol>
  <p class="note">Sent from <a href="./">Set Replay</a>. The prompt travels in this link only; nothing was uploaded.</p>
</main>
<script type="module">
  const SERVICES = {
    spotify: { name: "Spotify", open: "https://open.spotify.com/", how: ["Copy the prompt.", "In the Spotify app, go to <b>Your Library</b>, tap <b>Create</b>, then <b>Prompted Playlist</b> (Premium; in English; a beta, so it may not be on your account yet).", "Paste it, pick daily or weekly refresh if you like, and tap <b>Generate playlist</b>."] },
    youtube: { name: "YouTube Music", open: "https://music.youtube.com/", how: ["Copy the prompt.", "In YouTube Music, open <b>Library</b>, tap <b>New</b>, then the <b>AI playlist</b> option.", "Paste it, then adjust the playlist there."] },
    apple: { name: "Apple Music", open: "https://music.apple.com/", how: ["Copy the prompt.", "In Apple Music, open <b>Playlist Playground</b> (a beta).", "Paste it, then refine the playlist there."] },
    deezer: { name: "Deezer", open: "https://www.deezer.com/", how: ["Copy the prompt.", "In Deezer, start a <b>Playlist with AI</b> (a beta).", "Paste it, then refine the playlist there."] },
    chat: { name: null, open: null, how: ["Copy the prompt.", "Paste it into any AI assistant.", "Look the tracks up in your music app."] },
  };
  const q = new URLSearchParams(location.hash.slice(1));
  const text = q.get("p") || "", S = SERVICES[q.get("t")] || SERVICES.spotify;
  const $ = (id) => document.getElementById(id);
  $("p").value = text || "No prompt in this link. Open Set Replay on your computer and use Send to your phone again.";
  if (S.name) { $("h").textContent = `Your ${S.name} playlist prompt`; $("open").textContent = `Open ${S.name}`; $("open").href = S.open; } else $("open").hidden = true;
  $("how").innerHTML = S.how.map((s) => `<li>${s}</li>`).join("");
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); $("status").textContent = "Copied. Now paste it in the app."; }
    catch (e) { $("p").focus(); $("p").select(); $("status").textContent = "Press and hold the text to copy it."; }
  });
</script>
</body>
</html>
